[project]
name = "seller-unit-economics"
version = "1.0.0"
description = "Юнит-экономика селлера по отчётам Wildberries и Ozon: настольное приложение на PySide6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "PySide6>=6.7",
]

[project.scripts]
unit-economics = "unit_economics.cli:main"

[project.gui-scripts]
unit-economics-gui = "unit_economics.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "ruff>=0.12",
    "mypy>=1.17",
    "pandas-stubs>=2.2",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unit_economics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "DTZ"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/unit_economics/demo.py" = ["S311"]  # синтетические данные, не криптография

[tool.ruff.lint.isort]
known-first-party = ["unit_economics"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
